# Local 2-instance cluster: nginx -> api-1/api-2, shared MySQL + Redis, Prometheus + Grafana.
# Build the jar first: (cd ../../backend/api && sh gradlew bootJar -x test) && cp ../../backend/api/build/libs/api-0.0.1-SNAPSHOT.jar ./api.jar
x-api: &api
  build: { context: ., dockerfile: Dockerfile.api }
  depends_on:
    mysql: { condition: service_healthy }
    redis: { condition: service_started }
  environment: &api-env
    MYSQL_URL: jdbc:mysql://mysql:3306/fooding?serverTimezone=Asia/Seoul
    MYSQL_USER: fooding
    MYSQL_PASSWORD: fooding
    REDIS_HOST: redis
    # local-only dummy secrets
    JWT_SECRET_KEY: local-cluster-secret-key-at-least-32-bytes!!
    JWT_ISSUER: fooding-local
    JWT_SALT: local
    JWT_ACCESS_TOKEN_EXPIRETIME: "86400000"
    JWT_REFRESH_TOKEN_EXPIRETIME: "86400000"
    NAVER_SECRET_KEY: dummy
    NAVER_LOGIN_URL: http://localhost
    AWS_S3_ACCESS_KEY: dummy
    AWS_S3_SECRET_KEY: dummy
    AWS_S3_BUCKET_REGION: ap-northeast-2
    AWS_S3_BUCKET_NAME: dummy

services:
  api-1:
    <<: *api
    environment: { <<: *api-env, INSTANCE_ID: api-1 }
    ports: ["8081:8080"]
  api-2:
    <<: *api
    environment: { <<: *api-env, INSTANCE_ID: api-2 }
    ports: ["8082:8080"]

  nginx:
    image: nginx:1.27-alpine
    volumes: ["./nginx/nginx.conf:/etc/nginx/nginx.conf:ro"]
    ports: ["8080:80"]
    depends_on: [api-1, api-2]

  redis:
    image: redis:7.2-alpine
    ports: ["6379:6379"]

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: fooding
      MYSQL_USER: fooding
      MYSQL_PASSWORD: fooding
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 3s
      retries: 30

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes: ["./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro"]
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]

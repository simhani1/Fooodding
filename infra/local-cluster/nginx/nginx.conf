worker_processes auto;
events { worker_connections 4096; }   # each SSE stream holds 2 connections (client + upstream)

http {
    # upstream_bytes = bytes nginx read from Spring for this request; used to size proxy_buffer_size.
    log_format sse '$remote_addr "$request" $status up=$upstream_addr '
                   'upstream_bytes=$upstream_bytes_received sent=$bytes_sent rt=$request_time';
    access_log /dev/stdout sse;

    upstream fooding_api {
        # passive health check: one failed connect takes the server out for 10s
        server api-1:8080 max_fails=1 fail_timeout=10s;
        server api-2:8080 max_fails=1 fail_timeout=10s;
        keepalive 32;
    }

    # A crashed container's IP stops answering SYNs: without this nginx waits the 60s default before failing over.
    # Retrying on connect failure is safe even for POST — the request never reached the upstream.
    proxy_connect_timeout 1s;

    server {
        listen 80 so_keepalive=30s:10s:3;

        location /api/v1/waiting/owners/ {
            proxy_pass http://fooding_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;

            proxy_buffering off;          # pass every SSE frame through immediately
            proxy_cache off;
            gzip off;
            # With buffering off this is the single read buffer for headers + each chunk.
            # PROXY_BUFFER_SIZE is tuned from measured frame sizes (see scenario/buffer_experiment.sh).
            proxy_buffer_size 4k;

            proxy_read_timeout 120s;      # gap between reads; heartbeat (10s) keeps resetting it
            send_timeout 30s;             # owner not reading for 30s -> drop, frees the upstream write
        }

        location / {
            proxy_pass http://fooding_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
        }
    }
}
